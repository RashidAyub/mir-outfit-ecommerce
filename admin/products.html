<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Products | Admin | MIR OUTFIT</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body data-page="products">

    <!-- Mobile Sidebar Toggle -->
    <button class="sidebar-toggle" id="sidebar-toggle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>

    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="admin-sidebar" id="admin-sidebar">
            <div class="sidebar-header">
                <h2>MIR OUTFIT</h2>
                <p>Admin Control Panel</p>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
                    Dashboard
                </a>
                <a href="products.html" class="active">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path><line x1="7" y1="7" x2="7.01" y2="7"></line></svg>
                    Products
                </a>
                <a href="orders.html">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
                    Orders
                </a>
                <a href="#">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    Customers
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="#" id="admin-logout">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    Logout
                </a>
                <a href="../index.html" style="margin-top:12px; color:rgba(255,255,255,0.3);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2-2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    View Store
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">
            <!-- Topbar -->
            <header class="admin-topbar">
                <h1>Products</h1>
                <div class="topbar-meta">
                    <button class="btn-admin btn-admin-primary" id="btn-add-product">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                        Add New Product
                    </button>
                    <div class="admin-avatar" id="admin-initial">A</div>
                </div>
            </header>

            <div class="admin-content">
                <div class="admin-product-grid" id="admin-product-grid">
                    <!-- Dynamic Products -->
                    <div class="admin-empty" style="grid-column: 1 / -1;">Loading products...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Product Modal -->
    <div class="admin-modal-overlay" id="product-modal">
        <div class="admin-modal">
            <h3 id="modal-title">Add Product</h3>
            <form id="product-form">
                <input type="hidden" id="prod-id">
                <div class="admin-form-group">
                    <label>Product Name</label>
                    <input type="text" id="prod-name" required placeholder="e.g. Classic Summer Suit">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="admin-form-group">
                        <label>Price (₨)</label>
                        <input type="number" id="prod-price" required min="0" placeholder="e.g. 5000">
                    </div>
                    <div class="admin-form-group">
                        <label>Category</label>
                        <select id="prod-category" required>
                            <option value="summer">Summer</option>
                            <option value="winter">Winter</option>
                            <option value="accessories">Accessories</option>
                        </select>
                    </div>
                </div>
                <div class="admin-form-group">
                    <label>Image URL</label>
                    <input type="text" id="prod-image" required placeholder="e.g. https://via.placeholder.com/400x500">
                </div>
                <div class="admin-form-group">
                    <label>Description</label>
                    <textarea id="prod-desc" required placeholder="Product description..."></textarea>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-admin btn-admin-outline" id="btn-cancel-product">Cancel</button>
                    <button type="submit" class="btn-admin btn-admin-primary">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
